<script>
/* ---- analysis.js ---- */
/* Demand Calendar — analysis engine.
 *
 * Mirrors analysis/seasonality.py. Both must agree: if you change a threshold or
 * the allocation maths here, change it there too, or the CLI and the app will
 * report different numbers for the same data.
 *
 * Extracted verbatim from the pre-React build and verified to produce identical
 * output on all eight terms. Pure logic only — no DOM, no rendering.
 */

const PHASE_META = {
  publish: { label: "Publish window", cls: "p-publish",
    ed: t => `Publish SEO pillar pages &amp; guides targeting “${t}” now — they need 8–12 weeks to rank before demand arrives.`,
    camp: () => `No spend. Build retargeting audiences; refresh landing pages.` },
  ramp: { label: "Ramp", cls: "p-ramp",
    ed: t => `Ship supporting posts, email series, and social around “${t}”; refresh top pages.`,
    camp: () => `Warm email/social pushes; soft-launch paid 2–4 weeks before the peak.` },
  peak: { label: "PEAK", cls: "p-peak",
    ed: () => `Conversion-focused content only: comparisons, FAQs, offers.`,
    camp: () => `Full paid spend, monitored daily. Capture, don't educate.` },
  cool: { label: "Cool-down", cls: "p-cool",
    ed: () => `Wrap-ups and testimonials; harvest UGC while it's fresh.`,
    camp: () => `Cut spend fast — interest falls quicker than it rose. Retargeting only.` },
  second: { label: "Secondary bump", cls: "p-second",
    ed: t => `Lighter rerun of the peak playbook for “${t}”.`,
    camp: () => `Modest paid flight sized to the bump's index.` },
  off: { label: "Off-season", cls: "p-off",
    ed: () => `Evergreen content, refreshes, link building; plan the next cycle.`,
    camp: () => `Minimal always-on brand spend.` },
  steady: { label: "Steady", cls: "p-steady",
    ed: () => `Maintain cadence on evergreen topics.`,
    camp: () => `Efficiency-focused always-on spend.` },
};

/* ================= analysis (mirrors analysis/seasonality.py) ============= */
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const REAL_PEAK_INDEX = 115, MILD_BUMP_INDEX = 107, OFF_SEASON_INDEX = 88,
      CONSISTENCY_REQUIRED = 0.6, RAMP_FRACTION = 0.5,
      ANOMALY_Z = 3.5, ANOMALY_FLOOR_FRAC = 0.30, ANOMALY_MIN_POINTS = 3,
      ANOMALY_RATIO = 1.5,
      MIN_RAMP_AMPLITUDE = 0.10,   // flatter than this and there is no ramp to date
      MIN_RESOLUTION_STEP_PCT = 8; // one integer step above this = rounding error

const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

function parseDates(iso) { return iso.map(s => {
  const p = s.split("-").map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2] || 15)); }); }

function isoWeek(d) {
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3);
  const f = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  f.setUTCDate(f.getUTCDate() - ((f.getUTCDay() + 6) % 7) + 3);
  return Math.min(1 + Math.round((t - f) / 6048e5), 52);
}

function monthlyIndex(dates, values) {
  const byMonth = {}, byYM = {};
  dates.forEach((d, i) => {
    const m = d.getUTCMonth() + 1, y = d.getUTCFullYear();
    (byMonth[m] ??= []).push(values[i]);
    ((byYM[y] ??= {})[m] ??= []).push(values[i]);
  });
  const perYear = {};
  for (const y in byYM) {
    const months = byYM[y];
    if (Object.keys(months).length < 10) continue;   // partial years at range edges
    const ym = mean(Object.values(months).flat());
    if (!ym) continue;
    perYear[y] = {};
    for (const m in months) perYear[y][m] = mean(months[m]) / ym * 100;
  }

  // Average the within-year indices rather than pooling raw values: pooling lets a
  // secular trend pose as seasonality whenever the window doesn't start in January
  // (a 2021-08..2026-08 export covers Jan-Jul in six years but Sep-Dec in five, so
  // a term that doubles mid-window gets a fake first-half peak). Pooled fallback
  // only when there aren't two complete years to average.
  // Median across years, matching weeklyCurve. The mean lets one extreme year set
  // the headline: Dobbs puts vasectomy's June 2022 at a within-year index of 166
  // against ~100 elsewhere, and the mean reads 117 — peak territory. The label
  // would still say INCONSISTENT, but this number drives the heatmap colour and
  // the budget allocator, and the allocator reads numbers, not labels.
  const index = {};
  const years = Object.keys(perYear);
  if (years.length >= 2) {
    for (let m = 1; m <= 12; m++) {
      const vals = years.filter(y => perYear[y][m] !== undefined)
                        .map(y => perYear[y][m]);
      if (vals.length) index[m] = median(vals);
    }
  } else {
    const overall = mean(values);
    if (overall)
      for (let m = 1; m <= 12; m++)
        if (byMonth[m]) index[m] = mean(byMonth[m]) / overall * 100;
  }
  return { index, perYear };
}

function classifyMonths({ index, perYear }) {
  const out = {};
  for (let m = 1; m <= 12; m++) {
    const idx = index[m];
    if (idx === undefined) continue;
    const yrs = Object.keys(perYear).filter(y => perYear[y][m] !== undefined);
    const peaked = yrs.filter(y => perYear[y][m] >= MILD_BUMP_INDEX);
    const cons = yrs.length ? peaked.length / yrs.length : 0;
    let label;
    if (idx >= REAL_PEAK_INDEX && cons >= CONSISTENCY_REQUIRED) label = "REAL PEAK";
    else if (idx >= MILD_BUMP_INDEX && cons >= CONSISTENCY_REQUIRED) label = "MILD BUMP";
    else if (idx >= MILD_BUMP_INDEX) label = "INCONSISTENT";
    else if (idx <= OFF_SEASON_INDEX) label = "OFF-SEASON";
    else label = "NO PEAK";
    out[m] = { index: Math.round(idx * 10) / 10, label, consistency: cons };
  }
  return out;
}

/* Median across years, not mean: one viral year would otherwise hand the average
   year a peak that only happened once (see the Dobbs spike in vasectomy). */
function weeklyCurve(dates, values) {
  const byWeek = {};
  dates.forEach((d, i) => (byWeek[isoWeek(d)] ??= []).push(values[i]));
  const raw = [];
  for (let w = 1; w <= 52; w++) raw.push(byWeek[w] ? median(byWeek[w]) : 0);
  return raw.map((_, i) =>
    mean([raw[(i + 51) % 52], raw[i], raw[(i + 1) % 52]]));
}

/* Returns defined:false when the curve is too flat to time against. On a flat
   series the argmax is just the noisiest week, and dating a ramp off it produces
   a confident "publish by" built from rounding error. */
function rampAndPeak(curve) {
  let peakI = 0;
  curve.forEach((v, i) => { if (v > curve[peakI]) peakI = i; });
  const med = median(curve);
  const amplitude = med ? (curve[peakI] - med) / med : 0;
  if (amplitude < MIN_RAMP_AMPLITUDE)
    return { defined: false, peakWeek: peakI + 1, amplitude };

  const sorted = [...curve].sort((a, b) => a - b);
  const baseline = sorted[Math.floor(52 * .25)];
  const thr = baseline + RAMP_FRACTION * (curve[peakI] - baseline);
  let rampI = peakI;
  for (let s = 1; s < 52; s++) {
    const i = (peakI - s + 52) % 52;
    if (curve[i] < thr) { rampI = (i + 1) % 52; break; }
  }
  return { defined: true, peakWeek: peakI + 1, rampWeek: rampI + 1,
           leadWeeks: (peakI - rampI + 52) % 52, amplitude };
}

/* How coarse a term is on its export's shared 0-100 scale. Trends scales every
   term against the largest one, so a small term can land in single digits where
   one integer step swamps its own seasonality. */
function seriesResolution(values) {
  const m = mean(values);
  const stepPct = m ? 100 / m : Infinity;
  return { mean: Math.round(m * 10) / 10, distinct: new Set(values).size,
           stepPct: Math.round(stepPct * 10) / 10,
           usable: stepPct <= MIN_RESOLUTION_STEP_PCT };
}

/* Median+MAD anomaly test (same rationale as the Python version: with one
   observation per year, a spike inflates a mean/stdev test into never firing). */
function findAnomalies(dates, values, keyFn) {
  const byYear = {};
  dates.forEach((d, i) => (byYear[d.getUTCFullYear()] ??= []).push(values[i]));
  const overall = mean(values), yearMean = {};
  for (const y in byYear)
    yearMean[y] = byYear[y].length >= 6 ? mean(byYear[y]) : overall;

  const groups = {};
  dates.forEach((d, i) => {
    const det = yearMean[d.getUTCFullYear()]
      ? values[i] / yearMean[d.getUTCFullYear()] * overall : values[i];
    (groups[keyFn(d)] ??= []).push({ d, v: values[i], det });
  });

  // Floor scales with the series' own mean: a fixed 15-point floor demands a 4x
  // spike from a term Trends has squashed into single digits, and so never fires.
  const floor = Math.max(ANOMALY_MIN_POINTS, ANOMALY_FLOOR_FRAC * overall);
  const out = [];
  for (const k in groups) {
    const obs = groups[k];
    if (obs.length < 3) continue;
    const med = median(obs.map(o => o.det));
    const mad = median(obs.map(o => Math.abs(o.det - med)));
    for (const { d, v, det } of obs) {
      const gap = det - med;
      if (gap < floor || det < ANOMALY_RATIO * med) continue;
      if (mad > 0 && 0.6745 * gap / mad < ANOMALY_Z) continue;
      out.push({ date: d, value: v, typical: Math.round(med * 10) / 10 });
    }
  }
  return out.sort((a, b) => a.date - b.date);
}

const REF_YEAR = 2026;
function weekToDate(w) {
  return new Date(Date.UTC(REF_YEAR, 0, 1 + (w - 1) * 7 + 3));
}
const fmtWeek = w => { const d = weekToDate(w);
  return `~${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`; };
const fmtDate = d => `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`;
const fmtMonthYear = d => `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
const wrapW = w => ((w - 1) % 52 + 52) % 52 + 1;

function analyzeTerm(term) {
  const a = { name: term.name };
  if (term.monthly) {
    const dates = parseDates(term.monthly.dates), vals = term.monthly.values;
    a.monthly = { dates, vals, source: term.monthly.source,
      months: classifyMonths(monthlyIndex(dates, vals)),
      resolution: seriesResolution(vals),
      anomalies: findAnomalies(dates, vals, d => d.getUTCMonth() + 1) };
  }
  if (term.weekly) {
    const dates = parseDates(term.weekly.dates), vals = term.weekly.values;
    const curve = weeklyCurve(dates, vals);
    a.weekly = { dates, vals, curve, source: term.weekly.source,
      resolution: seriesResolution(vals),
      ...rampAndPeak(curve),
      anomalies: findAnomalies(dates, vals, isoWeek) };
  }
  // Report the monthly series' resolution: it drives the seasonal index, the
  // heatmap and the budget. A term can now have a clean standalone monthly export
  // and a squashed weekly one left over from a comparison export.
  a.resolution = a.monthly?.resolution ?? a.weekly?.resolution ?? null;

  // a.timing is null when the data gives no season worth timing against. Every
  // consumer must handle that — inventing a date here is the failure mode this
  // whole tool exists to prevent.
  a.timing = null;
  // The weekly amplitude test measures shape; the monthly classifier tests
  // whether that shape recurs. A ramp stands only when both agree, so the site
  // can never date a campaign against a month it has just labelled NO PEAK.
  const peakMonthInfo = a.weekly?.defined
    ? a.monthly?.months?.[monthOfWeek(a.weekly.peakWeek)] : null;
  // A weekly series too coarse to read cannot date a ramp either.
  const weeklyTooCoarse = a.weekly?.defined && !a.weekly.resolution.usable;
  const weeklyVetoed = a.weekly?.defined && (weeklyTooCoarse || (a.monthly
    && !["REAL PEAK", "MILD BUMP"].includes(peakMonthInfo?.label)));
  if (weeklyVetoed) a.weeklyVeto = { label: peakMonthInfo?.label || "NO PEAK",
    peakWeek: a.weekly.peakWeek, amplitude: a.weekly.amplitude };

  if (a.weekly?.defined && !weeklyVetoed) {
    const w = a.weekly;
    a.timing = { precision: "week", peakWeek: w.peakWeek, rampWeek: w.rampWeek,
      leadWeeks: w.leadWeeks, publishWeek: wrapW(w.rampWeek - 8),
      paidWeek: wrapW(w.peakWeek - 3), amplitude: w.amplitude };
  } else if (!a.weekly && a.monthly) {
    // No weekly file: fall back to month precision. "Defined" borrows the
    // classifier's verdict, not a bare threshold, so a month that is only
    // elevated in a minority of years never becomes a campaign date.
    const idx = a.monthly.months;
    let peakM = 1;
    for (let m = 2; m <= 12; m++)
      if ((idx[m]?.index ?? 0) > (idx[peakM]?.index ?? 0)) peakM = m;
    if (["REAL PEAK", "MILD BUMP"].includes(idx[peakM]?.label))
      a.timing = { precision: "month", peakMonth: peakM,
        rampMonth: (peakM + 10) % 12 + 1 };
  }
  if (!a.timing) {
    let peakM = 1;
    const idx = a.monthly?.months || {};
    for (let m = 2; m <= 12; m++)
      if ((idx[m]?.index ?? 0) > (idx[peakM]?.index ?? 0)) peakM = m;
    a.noSeason = { highMonth: peakM,
      amplitude: a.weekly?.amplitude ?? null };
  }
  return a;
}


/* ============================ state & data ================================ */
const LS_IMPORT = "dc_import_v1", LS_ASSUMED = "dc_assumed_v1", LS_THEME = "dc_theme";
const store = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; }
                     catch { return {}; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

function mergedData() {
  const overlay = store(LS_IMPORT);
  return DEMAND_DATA.categories.map(cat => {
    const terms = cat.terms.map(t => ({ ...t }));
    const extra = overlay[cat.id] || {};
    for (const name in extra) {
      let t = terms.find(x => x.name === name);
      if (!t) { t = { name }; terms.push(t); }
      if (extra[name].monthly) t.monthly = extra[name].monthly;
      if (extra[name].weekly) t.weekly = extra[name].weekly;
    }
    return { ...cat, terms };
  });
}

let CATS = mergedData();
let curCat = CATS[0].id;
const curTerm = {};   // per-category selected term
const analysisCache = {};

function getAnalysis(catId, termName) {
  const key = catId + "::" + termName;
  if (!analysisCache[key]) {
    const cat = CATS.find(c => c.id === catId);
    analysisCache[key] = analyzeTerm(cat.terms.find(t => t.name === termName));
  }
  return analysisCache[key];
}

function defaultTerm(cat) {
  // Most seasonal term makes the best default view — but resolution comes first.
  // A term Trends squashed into single digits shows a huge index spread made of
  // rounding steps, and would otherwise win this contest on pure noise.
  let best = cat.terms[0].name, bestKey = [-1, -1];
  for (const t of cat.terms) {
    const a = getAnalysis(cat.id, t.name);
    if (!a.monthly) continue;
    const idxs = Object.values(a.monthly.months).map(m => m.index);
    const spread = Math.max(...idxs) - Math.min(...idxs);
    const key = [a.resolution?.usable ? 1 : 0, spread];
    if (key[0] > bestKey[0] || (key[0] === bestKey[0] && key[1] > bestKey[1])) {
      bestKey = key; best = t.name;
    }
  }
  return best;
}

function assumedFor(catId) {
  const saved = store(LS_ASSUMED);
  if (saved[catId]) return saved[catId];
  return CATS.find(c => c.id === catId).assumed || [];
}

/* ============================== verdicts ================================== */
function verdictFor(catId, assumption) {
  const cat = CATS.find(c => c.id === catId);
  const m = assumption.month;
  const near = x => Math.min(Math.abs(x - m), 12 - Math.abs(x - m));
  let confirmed = null, shifted = null, mild = null;
  for (const t of cat.terms) {
    const a = getAnalysis(catId, t.name);
    if (!a.monthly) continue;
    const months = a.monthly.months;
    const info = months[m];
    if (info?.label === "REAL PEAK" && !confirmed)
      confirmed = { term: t.name, info };
    // A neighbouring month counts as "you had the season, wrong month" if it is
    // a real peak, or a mild bump that shows up in nearly every year. The second
    // case matters: "wedding" bumps every single July, and telling someone their
    // June assumption is merely overrated would bury the one-month correction.
    for (let x = 1; x <= 12; x++) {
      const inf = months[x];
      if (!inf || near(x) === 0 || near(x) > 2) continue;
      const strong = inf.label === "REAL PEAK"
        || (inf.label === "MILD BUMP" && inf.consistency >= 0.75);
      if (strong && (!shifted || inf.index > shifted.info.index))
        shifted = { term: t.name, month: x, info: inf };
    }
    if (info?.label === "MILD BUMP" && !mild) mild = { term: t.name, info };
  }
  // A real peak somewhere else in the year is the most useful thing we can say
  // when the assumed month doesn't hold up — don't bury it.
  let elsewhere = null;
  for (const t of cat.terms) {
    const months = getAnalysis(catId, t.name).monthly?.months;
    if (!months) continue;
    for (let x = 1; x <= 12; x++)
      if (months[x]?.label === "REAL PEAK" && near(x) > 2
          && (!elsewhere || months[x].index > elsewhere.info.index))
        elsewhere = { term: t.name, month: x, info: months[x] };
  }
  const redirect = elsewhere
    ? ` The real peak is <b>${MONTHS[elsewhere.month - 1]}</b> — “${elsewhere.term}”
        index ${elsewhere.info.index}, in ${Math.round(elsewhere.info.consistency * 100)}%
        of years. Move the plan there.` : "";

  if (confirmed) return { v: "CONFIRMED", cls: "v-confirmed", glyph: "✓", color: "var(--good)",
    why: `“${confirmed.term}” peaks in ${MONTHS[m - 1]}: index ${confirmed.info.index}, in ${Math.round(confirmed.info.consistency * 100)}% of years.` };
  if (shifted) return { v: "MISTIMED", cls: "v-mistimed", glyph: "⇄", color: "var(--warning)",
    why: `The real peak is ${MONTHS[shifted.month - 1]}, not ${MONTHS[m - 1]} — “${shifted.term}” index ${shifted.info.index} there. Shift the plan.` };
  if (mild) return { v: "OVERRATED", cls: "v-overrated", glyph: "◐", color: "var(--serious)",
    why: `Only a mild bump for “${mild.term}” (index ${mild.info.index}). Worth a nod, not a campaign.${redirect}` };
  return { v: "BUSTED", cls: "v-busted", glyph: "✕", color: "var(--critical)",
    why: `No tracked term shows a real ${MONTHS[m - 1]} peak. Stop planning around this.${redirect}` };
}


function monthOfWeek(w) { return weekToDate(w).getUTCMonth() + 1; }

function buildPhases(a) {
  const phases = {};
  for (let m = 1; m <= 12; m++) phases[m] = "steady";
  const months = a.monthly?.months || {};
  for (let m = 1; m <= 12; m++)
    if (months[m]?.label === "OFF-SEASON") phases[m] = "off";
  const t = a.timing;
  if (!t) return phases;
  const paint = (fromW, toW, phase) => {   // inclusive weeks, circular
    for (let s = 0; s <= (toW - fromW + 52) % 52; s++)
      phases[monthOfWeek(wrapW(fromW + s))] = phase;
  };
  if (t.precision === "week") {
    paint(wrapW(t.peakWeek + 1), wrapW(t.peakWeek + 4), "cool");
    paint(wrapW(t.rampWeek - 12), wrapW(t.rampWeek - 1), "publish");
    paint(t.rampWeek, wrapW(t.peakWeek - 1), "ramp");
    phases[monthOfWeek(t.peakWeek)] = "peak";
  } else {
    phases[t.peakMonth] = "peak";
    phases[t.rampMonth] = "ramp";
    phases[(t.rampMonth + 10) % 12 + 1] = "publish";
    phases[t.peakMonth % 12 + 1] = "cool";
  }
  // Months that peak in the monthly data but sit outside the main ramp→peak arc.
  // A month inside the cool-down window that is itself a real peak is a second
  // peak, not a fade — calling it cool-down would cut spend during live demand.
  for (let m = 1; m <= 12; m++) {
    const label = months[m]?.label;
    if (["REAL PEAK", "MILD BUMP"].includes(label)
        && ["steady", "off"].includes(phases[m])) phases[m] = "second";
    else if (label === "REAL PEAK" && phases[m] === "cool") phases[m] = "second";
  }
  return phases;
}


/* ============================ budget planner ============================== */
const ROLES = [
  { id: "wedding-planner", label: "Wedding planner", cat: "marriages", budget: 100000, mix: 35 },
  { id: "venue", label: "Wedding venue or caterer", cat: "marriages", budget: 250000, mix: 30 },
  { id: "jeweler", label: "Jeweler / engagement rings", cat: "marriages", budget: 500000, mix: 25 },
  { id: "family-law", label: "Family law attorney", cat: "divorces", budget: 120000, mix: 45 },
  { id: "mediator", label: "Divorce mediation practice", cat: "divorces", budget: 60000, mix: 50 },
  { id: "urology", label: "Urology clinic (vasectomy)", cat: "vasectomies", budget: 80000, mix: 40 },
  { id: "mens-health", label: "Men's health telehealth", cat: "vasectomies", budget: 400000, mix: 35 },
  { id: "obgyn", label: "OB-GYN or fertility clinic", cat: "births", budget: 150000, mix: 45 },
  { id: "baby-brand", label: "Baby & maternity brand", cat: "births", budget: 1000000, mix: 30 },
  { id: "custom", label: "Something else — I'll pick the category", cat: "marriages",
    budget: 250000, mix: 35 },
];
const LS_BUDGET = "dc_budget_v1";
const wrapM = m => ((m - 1) % 12 + 12) % 12 + 1;
const fmtMoney = n => "$" + Math.round(n).toLocaleString("en-US");
const fmtCompact = n => n >= 1e6 ? "$" + (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + "M"
  : n >= 1e3 ? "$" + Math.round(n / 1e3) + "K" : "$" + Math.round(n);
const pct = f => (f * 100).toFixed(1) + "%";

function budgetState() {
  const s = store(LS_BUDGET);
  const role = ROLES.find(r => r.id === s.role) || ROLES[0];
  return { role: role.id, cat: s.cat || role.cat,
    budget: Number.isFinite(s.budget) ? s.budget : role.budget,
    mix: Number.isFinite(s.mix) ? s.mix : role.mix,
    conc: Number.isFinite(s.conc) ? s.conc : 25 };
}

function allocate(months, budget, contentShare, gamma) {
  const idx = m => months[wrapM(m)]?.index ?? 100;
  const w = m => Math.pow(Math.max(idx(m), 1) / 100, gamma);
  const paidRaw = [], contRaw = [];
  for (let m = 1; m <= 12; m++) {
    paidRaw.push(0.5 * w(m) + 0.5 * w(m + 1));   // paid leads demand by ~2–4 weeks
    contRaw.push(w(m + 3));                       // content ranks ~3 months later
  }
  const norm = arr => { const s = arr.reduce((a, b) => a + b, 0); return arr.map(v => v / s); };
  const p = norm(paidRaw), c = norm(contRaw), paidShare = 1 - contentShare;
  const fracs = [], dollars = [];
  for (let i = 0; i < 12; i++) {
    const f = paidShare * p[i] + contentShare * c[i];
    fracs.push(f); dollars.push(Math.round(f * budget));
  }
  const diff = budget - dollars.reduce((a, b) => a + b, 0);   // keep the sum exact
  if (diff !== 0) {
    let mi = 0;
    dollars.forEach((v, i) => { if (v > dollars[mi]) mi = i; });
    dollars[mi] += diff;
  }
  return { fracs, dollars, paid: p, content: c, paidShare, contentShare };
}

const PHASE_BUCKET = { peak: "peak", ramp: "ramp", second: "ramp", publish: "publish",
  cool: "base", off: "base", steady: "base" };
const BUCKET_LABEL = { peak: "Peak — heaviest flight", ramp: "Pre-peak ramp or second bump",
  publish: "Publish window (content)", base: "Cool-down, off-season & always-on" };

function reasonFor(m, alloc, months, phases) {
  const i = m - 1;
  const idxOf = mm => Math.round(months[wrapM(mm)]?.index ?? 100);
  const cPart = alloc.contentShare * alloc.content[i];
  const pPart = alloc.paidShare * alloc.paid[i];
  const served = idxOf(m + 1) > idxOf(m) ? m + 1 : m;
  let lead;
  switch (phases[m]) {
    case "peak": lead = `Peak demand (index ${idxOf(m)}). Heaviest paid flight of the year — capture intent, don't educate.`; break;
    case "ramp": lead = `Demand climbing. Dollars placed now land ahead of ${MONTHS[wrapM(served) - 1]} (index ${idxOf(served)}).`; break;
    case "publish": lead = `Publish window. Pages shipped now have time to rank before ${MONTHS[wrapM(m + 3) - 1]} demand (index ${idxOf(m + 3)}).`; break;
    case "cool": lead = `Post-peak cool-down (index ${idxOf(m)}). Interest falls faster than it rose — harvest, then cut.`; break;
    case "second": lead = `Secondary bump (index ${idxOf(m)}). Lighter rerun of the peak playbook.`; break;
    case "off": lead = `Off-season (index ${idxOf(m)}). Always-on floor only; use the quiet for evergreen work.`; break;
    default: lead = `Steady demand (index ${idxOf(m)}). Efficiency spend.`;
  }
  const tot = cPart + pPart;
  const split = tot > 0 && cPart > pPart
    ? `Content-led: ${pct(cPart / tot)} of this month's dollars.`
    : `Paid-led: ${tot > 0 ? pct(pPart / tot) : "0%"} of this month's dollars.`;
  return `${lead} ${split}`;
}


/* Rebuild CATS from data.js plus any browser-imported overlay, and drop the
   memoised analyses. Called by the UI after an import or reset. */
function refreshData() {
  CATS = mergedData();
  for (const k in analysisCache) delete analysisCache[k];
  return CATS;
}

<script>
/* ---- weeks.js ---- */
/* Demand Calendar — week and holiday layer.
 *
 * Sits on top of analysis.js and reuses its thresholds, so a holiday can never
 * "land" on a bar the monthly classifier would have rejected. Mirrored by
 * analysis/holidays.py for the CLI.
 *
 * Hard limit worth knowing before reading any of this: Google Trends only
 * serves daily rows for ranges under ~9 months. Nothing here invents a daily
 * figure — day cells inherit their week's index, and the UI says so.
 */
"use strict";

/* =============================== holidays ================================= */
/* Dates are computed per year rather than hard-coded: most of these float, and
   a wrong date would silently attribute a lift to the wrong week. `tags` marks
   which categories a holiday is *claimed* to drive — the point is to test those
   claims, not to assume them. */

function nthWeekday(year, month, weekday, n) {   // month 1-12, weekday 0=Sun
  const first = new Date(Date.UTC(year, month - 1, 1));
  const shift = (weekday - first.getUTCDay() + 7) % 7;
  return new Date(Date.UTC(year, month - 1, 1 + shift + (n - 1) * 7));
}

function lastWeekday(year, month, weekday) {
  const last = new Date(Date.UTC(year, month, 0));
  const shift = (last.getUTCDay() - weekday + 7) % 7;
  return new Date(Date.UTC(year, month - 1, last.getUTCDate() - shift));
}

function easterSunday(year) {                    // Anonymous Gregorian algorithm
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mo = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(Date.UTC(year, mo - 1, day));
}

const addDays = (d, n) => new Date(d.getTime() + n * 864e5);

const HOLIDAY_CACHE = {};
function holidaysFor(year) {
  if (HOLIDAY_CACHE[year]) return HOLIDAY_CACHE[year];
  const tg = nthWeekday(year, 11, 4, 4);
  const L = [
    ["newyear",   "New Year's Day",   new Date(Date.UTC(year, 0, 1)),  ["divorces"],    "sparkles"],
    ["superbowl", "Super Bowl",       nthWeekday(year, 2, 0, 2),        ["vasectomies"], "target"],
    ["valentines","Valentine's Day",  new Date(Date.UTC(year, 1, 14)), ["marriages"],   "heart"],
    ["madness",   "March Madness",    addDays(nthWeekday(year, 3, 0, 2), 2), ["vasectomies"], "target"],
    ["easter",    "Easter",           easterSunday(year),               ["marriages"],   "sparkles"],
    ["mothers",   "Mother's Day",     nthWeekday(year, 5, 0, 2),        ["births"],      "baby"],
    ["memorial",  "Memorial Day",     lastWeekday(year, 5, 1),          ["marriages"],   "calendar-days"],
    ["fathers",   "Father's Day",     nthWeekday(year, 6, 0, 3),        ["births", "vasectomies"], "baby"],
    ["july4",     "Independence Day", new Date(Date.UTC(year, 6, 4)),  ["marriages"],   "sparkles"],
    ["labor",     "Labor Day",        nthWeekday(year, 9, 1, 1),        ["marriages"],   "calendar-days"],
    ["halloween", "Halloween",        new Date(Date.UTC(year, 9, 31)), [],              "calendar-days"],
    ["thanks",    "Thanksgiving",     tg,                               ["marriages"],   "calendar-days"],
    ["blackfri",  "Black Friday",     addDays(tg, 1),                   [],              "banknote"],
    ["cybermon",  "Cyber Monday",     addDays(tg, 4),                   [],              "banknote"],
    ["christmas", "Christmas Day",    new Date(Date.UTC(year, 11, 25)), ["marriages"],   "sparkles"],
    ["nye",       "New Year's Eve",   new Date(Date.UTC(year, 11, 31)), ["marriages"],   "sparkles"],
  ].map(([id, name, date, tags, icon]) => ({ id, name, date, tags, icon }))
   .sort((a, b) => a.date - b.date);
  HOLIDAY_CACHE[year] = L;
  return L;
}

const holidaysInMonth = (year, monthNo) =>
  holidaysFor(year).filter(h => h.date.getUTCMonth() + 1 === monthNo);

/* ---------------------- weekly index, within each year -------------------- */
/* Raw values are not comparable across years on a trending series, so each week
   is expressed against its own year's mean before anything is compared. */
function weeklyIndexByYear(weekly) {
  const byYear = {};
  weekly.dates.forEach((d, i) => {
    const y = d.getUTCFullYear();
    (byYear[y] ??= { weeks: {}, vals: [] });
    byYear[y].weeks[isoWeek(d)] = weekly.vals[i];
    byYear[y].vals.push(weekly.vals[i]);
  });
  const out = {};
  for (const y in byYear) {
    const m = mean(byYear[y].vals);
    if (!m || byYear[y].vals.length < 26) continue;   // skip ragged edge years
    out[y] = {};
    for (const w in byYear[y].weeks) out[y][w] = byYear[y].weeks[w] / m * 100;
  }
  return out;
}

/* Median week index across years, for one ISO week. */
function medianWeekIndex(idxByYear, week) {
  const w = ((week - 1) % 52 + 52) % 52 + 1;
  const vals = Object.keys(idxByYear).map(y => idxByYear[y][w])
    .filter(v => v !== undefined);
  return vals.length ? median(vals) : null;
}

/* Lift in the weeks running up to a holiday.
 *
 * Offsets are weeks relative to the holiday's own week: -4 is a month out, +1
 * the week after. Each offset takes the median across years, so one viral year
 * cannot manufacture a holiday effect, and counts how many years clear the bump
 * threshold. A holiday only "lands" when the median clears MILD_BUMP_INDEX and
 * repeats in at least CONSISTENCY_REQUIRED of years — the same bar the monthly
 * classifier uses, so the two can never disagree. */
const HOLIDAY_OFFSETS = [-4, -3, -2, -1, 0, 1];

function holidaySensitivity(weekly, holidayId) {
  if (!weekly) return null;
  const idx = weeklyIndexByYear(weekly);
  const years = Object.keys(idx);
  if (years.length < 3) return null;

  const per = {};
  for (const off of HOLIDAY_OFFSETS) {
    const vals = [];
    for (const y of years) {
      const h = holidaysFor(+y).find(x => x.id === holidayId);
      if (!h) continue;
      const w = ((isoWeek(h.date) - 1 + off) % 52 + 52) % 52 + 1;
      if (idx[y][w] !== undefined) vals.push(idx[y][w]);
    }
    if (vals.length < 3) continue;
    per[off] = { median: Math.round(median(vals) * 10) / 10, years: vals.length,
                 hits: vals.filter(v => v >= MILD_BUMP_INDEX).length };
  }
  const offs = Object.keys(per);
  if (!offs.length) return null;
  const bestOff = offs.reduce((a, b) => per[b].median > per[a].median ? b : a);
  const best = per[bestOff];
  const consistency = best.hits / best.years;
  return { holidayId, per, bestOffset: +bestOff, bestMedian: best.median,
           consistency, years: best.years,
           lands: best.median >= MILD_BUMP_INDEX && consistency >= CONSISTENCY_REQUIRED };
}

/* Best term in a category that has readable weekly rows. Prefers usable
   resolution over anything else — a squashed weekly series cannot date a week
   any more than it could date a month. */
function weeklyTermFor(catId) {
  const cat = CATS.find(c => c.id === catId);
  if (!cat) return null;
  let best = null;
  for (const t of cat.terms) {
    const a = getAnalysis(catId, t.name);
    if (!a.weekly) continue;
    const usable = a.weekly.resolution.usable;
    if (!best || (usable && !best.usable)) best = { name: t.name, a, usable };
  }
  return best;
}

/* ISO weeks overlapping a calendar month, with the days each contributes. */
function weeksInMonth(year, monthNo) {
  const last = new Date(Date.UTC(year, monthNo, 0)).getUTCDate();
  const seen = new Map();
  for (let day = 1; day <= last; day++) {
    const d = new Date(Date.UTC(year, monthNo - 1, day));
    const w = isoWeek(d);
    if (!seen.has(w)) seen.set(w, { week: w, days: [] });
    seen.get(w).days.push(d);
  }
  return [...seen.values()];
}

/* Split one month's dollars across its ISO weeks.
 *
 * Weights follow demand two weeks ahead of the spend — the same lead the monthly
 * allocator uses — so a week buys demand it can still influence. Month totals are
 * preserved exactly, keeping this consistent with the budget table above it. */
function weekSplitForMonth(weekly, monthNo, monthDollars, gamma, year) {
  const weeks = weeksInMonth(year, monthNo);
  if (!weeks.length) return [];
  if (!weekly) {
    const even = Math.floor(monthDollars / weeks.length);
    const out = weeks.map(w => ({ ...w, dollars: even, index: null }));
    out[0].dollars += monthDollars - even * weeks.length;
    return out;
  }
  const idx = weeklyIndexByYear(weekly);
  const at = w => medianWeekIndex(idx, w) ?? 100;
  const raw = weeks.map(w => Math.pow(Math.max(at(w.week + 2), 1) / 100, gamma));
  const sum = raw.reduce((a, b) => a + b, 0) || 1;
  const dollars = raw.map(v => Math.round(v / sum * monthDollars));
  const drift = monthDollars - dollars.reduce((a, b) => a + b, 0);
  if (drift) {
    let mi = 0;
    dollars.forEach((v, i) => { if (v > dollars[mi]) mi = i; });
    dollars[mi] += drift;
  }
  return weeks.map((w, i) => ({ ...w, dollars: dollars[i],
    index: Math.round(at(w.week) * 10) / 10 }));
}

/* The year a marketing team would be planning: the next full calendar year. */
const PLANNING_YEAR = new Date().getUTCFullYear() + 1;

</script>

function Hero({ cats, active, toggle }) {

      </p>
      <div class="mt-7 flex flex-wrap items-center gap-2">
        ${cats.map(c => {
          const t = theme(c.id), on = active.includes(c.id);
          return html`
            <button key=${c.id} onClick=${() => toggle(c.id)} aria-pressed=${on}
              class=${"group flex items-center gap-2 rounded-full border px-4 py-2 text-[13.5px] font-medium transition-all duration-200 active:scale-[0.97] "
                + (on ? "shadow-sm" : "border-[#E2E8F0] bg-white text-slate-500 hover:border-slate-300 hover:text-slate-700")}
              style=${on ? { background: t.soft, borderColor: t.edge, color: t.ink } : undefined}>
              <${Icon} name=${t.icon} size=${15}
                style=${{ color: on ? t.mid : "#94A3B8" }}
                className="transition-transform duration-200 group-hover:scale-110" />
              ${t.label}
            </button>`;
        })}
        ${active.length < cats.length && html`
          <button onClick=${() => toggle("__all")}
            class="ml-1 text-[12.5px] font-medium text-slate-400 underline-offset-4 hover:text-slate-700 hover:underline">
            Show all
          </button>`}
      </div>
    </div>`;
}

/* --------------------------- month drill-down ---------------------------- */
const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

function MonthDetail({ catId, monthNo, onClose, setTip }) {
  const t = theme(catId);
  const cat = CATS.find(c => c.id === catId);
  const wt = weeklyTermFor(catId);
  const weekly = wt?.usable ? wt.a.weekly : null;
  const idx = useMemo(() => weekly ? weeklyIndexByYear(weekly) : null, [weekly]);
  const year = PLANNING_YEAR;

  const st = budgetState();
  const headline = defaultTerm(cat);
  const ha = getAnalysis(catId, headline);
  const alloc = allocate(ha.monthly?.months || {}, st.budget, st.mix / 100, st.conc / 10);
  const monthDollars = alloc.dollars[monthNo - 1];
  const split = weekSplitForMonth(weekly, monthNo, monthDollars, st.conc / 10, year);
  const hols = holidaysInMonth(year, monthNo);

  const weekIndex = d => idx ? medianWeekIndex(idx, isoWeek(d)) : null;
  const maxWeek = Math.max(...split.map(w => w.dollars), 1);

  // Lay the month out as calendar rows, padded to Monday starts.
  const first = new Date(Date.UTC(year, monthNo - 1, 1));
  const pad = (first.getUTCDay() + 6) % 7;
  const lastDay = new Date(Date.UTC(year, monthNo, 0)).getUTCDate();
  const cells = [...Array(pad).fill(null),
    ...Array.from({ length: lastDay }, (_, i) => new Date(Date.UTC(year, monthNo - 1, i + 1)))];

  return html`
    <div class=${CARD + " mt-3 overflow-hidden"}>
      <div class="flex flex-wrap items-center gap-3 border-b border-[#E2E8F0] px-5 py-4"
        style=${{ background: `linear-gradient(180deg, ${t.soft}55, transparent)` }}>
        <span class="grid h-8 w-8 place-items-center rounded-xl" style=${{ background: t.soft, color: t.mid }}>
          <${Icon} name=${t.icon} size=${16} />
        </span>
        <div>
          <div class="text-[15px] font-semibold text-slate-800">
            ${t.label} · ${MONTHS[monthNo - 1]} ${year}
          </div>
          <div class="text-[11.5px] text-slate-400">
            ${weekly ? `week detail from “${wt.name}”` : "no readable weekly data for this category"}
          </div>
        </div>
        <button onClick=${onClose}
          class="ml-auto rounded-full border border-[#E2E8F0] bg-white px-3 py-1.5 text-[12.5px] font-medium text-slate-500 transition-colors hover:border-slate-300 hover:text-slate-800">
          Close
        </button>
      </div>

      <div class="grid gap-6 p-5 lg:grid-cols-[minmax(0,1fr)_300px]">
        <div>
          <div class="mb-2 grid grid-cols-7 gap-1.5">
            ${DOW.map(d => html`
              <div key=${d} class="text-center text-[10.5px] font-medium uppercase tracking-wider text-slate-400">${d}</div>`)}
          </div>
          <div class="grid grid-cols-7 gap-1.5">
            ${cells.map((d, i) => {
              if (!d) return html`<div key=${"p" + i} />`;
              const wi = weekIndex(d);
              // Holidays collide — Valentine's Day and the Super Bowl share
              // 14 Feb 2027 — so a day can carry more than one.
              const dayHols = hols.filter(h => h.date.getTime() === d.getTime());
              const bg = wi == null ? "#F8FAFC" : heatColor(catId, wi);
              return html`
                <div key=${d.toISOString()}
                  onMouseMove=${e => setTip({ x: e.clientX, y: e.clientY, html:
                    `<b>${MONTHS[monthNo - 1]} ${d.getUTCDate()}, ${year}</b>`
                    + `<br/>ISO week ${isoWeek(d)}`
                    + (wi == null ? `<br/><span class="text-slate-400">no weekly data</span>`
                        : `<br/>week index <b>${Math.round(wi)}</b>`)
                    + dayHols.map(h => `<br/><b>${h.name}</b>`).join("") })}
                  onMouseLeave=${() => setTip(null)}
                  class=${"relative flex h-14 flex-col justify-between rounded-lg p-1.5 transition-all duration-150 "
                    + (dayHols.length ? "ring-2 ring-offset-1 ring-offset-white " : "")
                    + (wi == null ? "border border-dashed border-[#E2E8F0] " : "")
                    + "hover:scale-[1.05] hover:z-10"}
                  style=${{ background: bg, ...(dayHols.length ? { "--tw-ring-color": t.mid } : {}) }}>
                  <span class="text-[11px] font-semibold tabular-nums"
                    style=${{ color: wi == null ? "#94A3B8" : t.ink }}>${d.getUTCDate()}</span>
                  ${dayHols.length > 0 && html`
                    <span class="truncate text-[9px] font-semibold leading-tight" style=${{ color: t.ink }}
                      title=${dayHols.map(h => h.name).join(" · ")}>
                      ${dayHols[0].name}${dayHols.length > 1 ? ` +${dayHols.length - 1}` : ""}
                    </span>`}
                </div>`;
            })}
          </div>
          <p class="mt-3 text-[11.5px] leading-relaxed text-slate-400">
            ${weekly
              ? html`Day tint is that day's <b>ISO week</b> index — Google Trends serves daily rows
                 only for ranges under about nine months, so nothing here claims day-level
                 precision. Ringed days are holidays.`
              : html`No readable weekly series for ${t.label.toLowerCase()}, so days are untinted.
                 Export this category's headline term at <b>Past 5 years</b> to fill this in.`}
          </p>
        </div>

        <div>
          <div class="text-[11px] font-semibold uppercase tracking-[0.1em] text-slate-400">
            Week by week
          </div>
          <div class="mt-3 space-y-2.5">
            ${split.map(w => {
              const share = w.dollars / (monthDollars || 1);
              return html`
                <div key=${w.week} class="group">
                  <div class="flex items-baseline justify-between text-[12px]">
                    <span class="font-medium text-slate-600">
                      Wk ${w.week}
                      <span class="text-slate-400"> · ${MONTHS[monthNo - 1]} ${w.days[0].getUTCDate()}–${w.days[w.days.length - 1].getUTCDate()}</span>
                    </span>
                    <span class="tabular-nums font-semibold text-slate-700">${fmtMoney(w.dollars)}</span>
                  </div>
                  <div class="mt-1 h-2 overflow-hidden rounded-full bg-slate-100">
                    <div class="h-full rounded-full transition-all duration-300"
                      style=${{ width: (w.dollars / maxWeek * 100) + "%", background: t.mid }} />
                  </div>
                  <div class="mt-1 flex justify-between text-[10.5px] text-slate-400">
                    <span>${w.index == null ? "index n/a" : `week index ${w.index}`}</span>
                    <span>${pct(share)} of month</span>
                  </div>
                </div>`;
            })}
          </div>
          <p class="mt-3 text-[11px] leading-relaxed text-slate-400">
            ${fmtMoney(monthDollars)} for ${MONTHS[monthNo - 1]} at your current
            ${fmtCompact(st.budget)} plan, split by demand two weeks ahead of each week —
            spend buys demand it can still influence. Month total is unchanged.
          </p>
        </div>
      </div>

      ${hols.length > 0 && html`
        <div class="border-t border-[#E2E8F0] bg-slate-50/60 px-5 py-4">
          <div class="text-[11px] font-semibold uppercase tracking-[0.1em] text-slate-400">
            Holidays this month
          </div>
          <div class="mt-3 grid gap-2.5 sm:grid-cols-2 lg:grid-cols-3">
            ${hols.map(h => {
              const s = weekly ? holidaySensitivity(weekly, h.id) : null;
              const claimed = h.tags.includes(catId);
              return html`
                <div key=${h.id} class="rounded-xl border border-[#E2E8F0] bg-white p-3">
                  <div class="flex items-center gap-2">
                    <span class="grid h-6 w-6 place-items-center rounded-lg"
                      style=${{ background: t.soft, color: t.mid }}>
                      <${Icon} name=${h.icon} size=${12} />
                    </span>
                    <span class="text-[12.5px] font-semibold text-slate-700">${h.name}</span>
                    <span class="ml-auto text-[11px] tabular-nums text-slate-400">
                      ${MONTHS[monthNo - 1]} ${h.date.getUTCDate()}
                    </span>
                  </div>
                  <div class="mt-2 text-[11.5px] leading-relaxed text-slate-500">
                    ${!s ? "No weekly data to test against."
                      : s.lands
                        ? html`<b class="text-emerald-700">Lands.</b> Peak lift
                            ${s.bestOffset === 0 ? "in the holiday week itself"
                              : s.bestOffset < 0 ? `${-s.bestOffset} week${s.bestOffset === -1 ? "" : "s"} before`
                              : "the week after"} —
                            index ${s.bestMedian}, in ${Math.round(s.consistency * 100)}% of
                            ${s.years} years. Pull budget forward to that week.`
                        : html`<b class="text-slate-600">No lift.</b> Best week reads
                            ${s.bestMedian} against a 100 baseline${s.bestMedian >= MILD_BUMP_INDEX
                              ? `, but only in ${Math.round(s.consistency * 100)}% of years` : ""}.
                            ${claimed ? " The claimed tie-in doesn't show up." : ""}`}
                  </div>
                </div>`;
            })}
          </div>
        </div>`}
    </div>`;
}

/* -------------------------------- heatmap -------------------------------- */
function Heatmap({ rows, setTip, openCell, setOpenCell }) {
  if (!rows.length) return html`
    <div class=${CARD + " grid place-items-center py-14 text-[13.5px] text-slate-400"}>
      Select a category above to see its year.
    </div>`;
  return html`
    <div class=${CARD + " overflow-hidden"}>
      <div class="overflow-x-auto">
        <div class="min-w-[720px] p-5">
          <div class="mb-2 grid grid-cols-[168px_repeat(12,1fr)] gap-x-1.5">
            <div />
            ${MONTHS.map(m => html`
              <div key=${m} class="text-center text-[11px] font-medium uppercase tracking-wider text-slate-400">${m}</div>`)}
          </div>
          ${rows.map(row => {
            const t = theme(row.cat.id), months = row.a.monthly?.months || {};
            let peakM = 1;
            for (let m = 2; m <= 12; m++)
              if ((months[m]?.index ?? 0) > (months[peakM]?.index ?? 0)) peakM = m;
            return html`
              <div key=${row.cat.id} class="grid grid-cols-[168px_repeat(12,1fr)] items-center gap-x-1.5 py-1.5">
                <div class="pr-3">
                  <div class="flex items-center gap-2">
                    <span class="grid h-6 w-6 place-items-center rounded-lg"
                      style=${{ background: t.soft, color: t.mid }}>
                      <${Icon} name=${t.icon} size=${13} />
                    </span>
                    <span class="text-[13.5px] font-semibold text-slate-700">${t.label}</span>
                  </div>
                  <div class="mt-0.5 pl-8 text-[11.5px] text-slate-400 truncate">“${row.term}”</div>
                </div>
                ${MONTHS.map((mn, i) => {
                  const m = i + 1, info = months[m];
                  if (!info) return html`<div key=${mn} class="h-11 rounded-lg bg-slate-50" />`;
                  const real = info.label === "REAL PEAK";
                  const strong = real || info.label === "MILD BUMP";
                  const bg = heatColor(row.cat.id, info.index);
                  const open = openCell && openCell.catId === row.cat.id && openCell.monthNo === m;
                  const nHol = holidaysInMonth(PLANNING_YEAR, m).length;
                  return html`
                    <button key=${mn} type="button"
                      aria-expanded=${open}
                      aria-label=${`${t.label}, ${mn}: index ${info.index}, ${info.label}. Open week detail.`}
                      onClick=${() => setOpenCell(open ? null : { catId: row.cat.id, monthNo: m })}
                      onMouseMove=${e => setTip({ x: e.clientX, y: e.clientY, html:
                        `<b>${t.label} · ${mn}</b><br/><span class="text-slate-500">“${row.term}”</span>`
                        + `<br/>index <b>${info.index}</b> · ${info.label}`
                        + `<br/>present in ${Math.round(info.consistency * 100)}% of years`
                        + `<br/><span class="text-slate-400">click for weeks & holidays</span>` })}
                      onMouseLeave=${() => setTip(null)}
                      class=${"relative grid h-11 w-full place-items-center rounded-lg transition-all duration-150 cursor-pointer hover:scale-[1.06] hover:z-10 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 "
                        + (real || open ? "ring-2 ring-offset-1 ring-offset-white" : "")}
                      style=${{ background: bg,
                                ...(real || open ? { "--tw-ring-color": open ? "#334155" : t.mid } : {}) }}>
                      ${strong && html`
                        <span class="text-[11.5px] font-semibold tabular-nums" style=${{ color: t.ink }}>
                          ${Math.round(info.index)}
                        </span>`}
                      ${m === peakM && real && html`
                        <span class="absolute -top-1 left-1/2 h-1.5 w-1.5 -translate-x-1/2 rotate-45 rounded-[1px]"
                          style=${{ background: t.mid }} />`}
                      ${nHol > 0 && html`
                        <span class="absolute bottom-1 left-1/2 flex -translate-x-1/2 gap-[2px]">
                          ${Array.from({ length: Math.min(nHol, 3) }, (_, k) => html`
                            <span key=${k} class="h-[3px] w-[3px] rounded-full"
                              style=${{ background: t.ink, opacity: .45 }} />`)}
                        </span>`}
                    </button>`;
                })}
              </div>`;
          })}
          <div class="mt-4 flex flex-wrap items-center gap-x-5 gap-y-2 border-t border-[#E2E8F0] pt-3 text-[11.5px] text-slate-400">
            <span class="flex items-center gap-1.5">
              <span class="h-2.5 w-6 rounded-full bg-gradient-to-r from-slate-100 to-slate-300" />
              cooler → hotter than that term's own average
            </span>
            <span class="flex items-center gap-1.5"><span class="h-2 w-2 rotate-45 rounded-[1px] bg-slate-400" /> real peak</span>
            <span class="flex items-center gap-1.5">
              <span class="flex gap-[2px]">
                ${[0, 1].map(k => html`<span key=${k} class="h-[3px] w-[3px] rounded-full bg-slate-400" />`)}
              </span>
              holidays that month
            </span>
            <span class="text-slate-500">click any month for weeks, days &amp; holiday lift</span>
          </div>
        </div>
      </div>
    </div>`;
}

/* ----------------------------- callout cards ----------------------------- */
/* Built from the analysis, never hand-written. A card can therefore say a peak
   is missing — which for three of these four categories is the finding. */
function buildCallouts(rows) {
  const out = [];
  for (const row of rows) {
    const t = theme(row.cat.id), months = row.a.monthly?.months || {};

    // Scan every term in the category, not just the headline one. December's
    // "engagement rings" peak is one of only two real peaks in the whole data
    // set and it is not the marriages headline term — reading the headline
    // alone would hide it.
    for (const term of row.cat.terms) {
      const ta = getAnalysis(row.cat.id, term.name);
      if (ta.resolution && !ta.resolution.usable) continue;   // rounding error, not a peak
      const tm = ta.monthly?.months || {};
      for (let m = 1; m <= 12; m++) {
        const info = tm[m];
        if (info?.label !== "REAL PEAK") continue;
        const tim = ta.timing;
        out.push({
          kind: "peak", cat: row.cat.id, rank: 0,
          tag: "Real peak", tagIcon: "circle-check",
          title: `${MONTHS[m - 1]} is when “${term.name}” peaks`,
          stat: `${Math.round(info.index)}`, statSub: "seasonal index",
          body: `It runs ${Math.round(info.index - 100)}% above its own yearly average every `
            + `${MONTHS[m - 1]}, in ${Math.round(info.consistency * 100)}% of the years on `
            + `record. `
            + (tim?.precision === "month"
              ? `Ramp begins ${MONTHS[(tim.peakMonth + 10) % 12]}; publish by `
                + `${MONTHS[(tim.peakMonth + 8) % 12]} so pages rank before demand arrives.`
              : tim ? `Ramp begins ${fmtWeek(tim.rampWeek)}; publish by `
                + `${fmtWeek(tim.publishWeek)}.` : ""),
        });
      }
      // One-off news events. Keep the biggest per term — they are the clearest
      // illustration of what this tool refuses to treat as seasonality.
      const an = (ta.monthly?.anomalies || [])
        .slice().sort((x, y) => y.value - x.value)[0];
      if (an) out.push({
        kind: "spike", cat: row.cat.id, rank: 1,
        tag: "One-off spike", tagIcon: "triangle-alert",
        title: `${fmtMonthYear(an.date)} — news, not a season`,
        stat: `${Math.round(an.value)}`, statSub: `vs ${an.typical} typical`,
        body: `“${term.name}” jumped to ${Math.round(an.value)} against a normal ${an.typical} `
          + `for that month. It happened once and never repeated, so it is excluded from the `
          + `calendar — planning against it would buy last year's news.`,
      });
    }

    for (const as of assumedFor(row.cat.id)) {
      const v = verdictFor(row.cat.id, as);
      if (v.v === "CONFIRMED") continue;
      out.push({
        kind: "myth", cat: row.cat.id, rank: v.v === "BUSTED" ? 2 : 1.5,
        tag: v.v, tagIcon: v.v === "BUSTED" ? "circle-x" : "circle-alert",
        title: as.name,
        stat: months[as.month] ? `${Math.round(months[as.month].index)}` : "—",
        statSub: `${MONTHS[as.month - 1]} index`,
        body: v.why.replace(/<[^>]+>/g, ""),
      });
    }
  }
  return out.sort((a, b) => a.rank - b.rank);
}

function CalloutCards({ callouts }) {
  if (!callouts.length) return null;
  return html`
    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      ${callouts.map((c, i) => {
        const t = theme(c.cat);
        const accent = c.kind === "peak" ? t.mid : c.kind === "spike" ? "#F59E0B" : "#94A3B8";
        const tone = c.kind === "peak" ? t.soft : c.kind === "spike" ? "#FEF3C7" : "#F1F5F9";
        return html`
          <article key=${i} class=${CARD + " " + CARD_HOVER + " group relative overflow-hidden p-5"}>
            <div class="absolute inset-x-0 top-0 h-[3px]" style=${{ background: accent, opacity: .8 }} />
            <div class="flex items-center gap-2">
              <span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[10.5px] font-semibold uppercase tracking-[0.08em]"
                style=${{ background: tone, color: c.kind === "myth" ? "#475569" : t.ink }}>
                <${Icon} name=${c.tagIcon} size=${12} /> ${c.tag}
              </span>
              <span class="ml-auto text-slate-300 transition-colors duration-200 group-hover:text-slate-400">
                <${Icon} name=${theme(c.cat).icon} size=${15} />
              </span>
            </div>
            <h3 class="mt-3 text-[15px] font-semibold leading-snug text-slate-800">${c.title}</h3>
            <div class="mt-3 flex items-baseline gap-2">
              <span class="text-[30px] font-semibold leading-none tracking-[-0.02em]"
                style=${{ color: c.kind === "myth" ? "#94A3B8" : t.ink }}>${c.stat}</span>
              <span class="text-[12px] text-slate-400">${c.statSub}</span>
            </div>
            <p class="mt-3 text-[13px] leading-relaxed text-slate-500">${c.body}</p>

}

/* --------------------------- holiday sensitivity ------------------------- */
/* Answers "how close to the holiday, and does it move?" for every category that
   has readable weekly rows. A claimed tie-in that fails is shown, not hidden —
   those are the ones a plan is most likely to be built on. */
function HolidayPanel({ rows }) {
  const items = [];
  const untestable = [];
  for (const row of rows) {
    const wt = weeklyTermFor(row.cat.id);
    if (!wt || !wt.usable) {
      untestable.push({ cat: row.cat.id,
        why: !wt ? "no weekly export" : `weekly series too coarse (${wt.a.weekly.resolution.stepPct}% per step)` });
      continue;
    }
    for (const h of holidaysFor(PLANNING_YEAR)) {
      const s = holidaySensitivity(wt.a.weekly, h.id);
      if (!s) continue;
      const claimed = h.tags.includes(row.cat.id);
      if (!s.lands && !claimed) continue;
      items.push({ cat: row.cat.id, term: wt.name, h, s, claimed });
    }
  }
  items.sort((a, b) => (b.s.lands - a.s.lands) || (b.s.bestMedian - a.s.bestMedian));
  if (!items.length && !untestable.length) return null;

  const when = off => off === 0 ? "holiday week"
    : off < 0 ? `${-off} wk${off === -1 ? "" : "s"} before` : "week after";

  return html`
    <div class=${CARD + " overflow-hidden"}>
      <div class="overflow-x-auto">
        <table class="w-full min-w-[680px] text-[13px]">
          <thead>
            <tr class="border-b border-[#E2E8F0] text-left text-[11px] font-medium uppercase tracking-[0.07em] text-slate-400">
              <th class="px-5 py-3">Holiday</th><th class="py-3">Category</th>
              <th class="py-3">Strongest week</th><th class="py-3 text-right">Index</th>
              <th class="py-3 text-right">Years</th><th class="px-5 py-3">Verdict</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(({ cat, term, h, s, claimed }) => {
              const t = theme(cat);
              return html`
                <tr key=${cat + h.id} class="border-b border-[#F1F5F9] transition-colors last:border-0 hover:bg-slate-50/70">
                  <td class="px-5 py-3">
                    <span class="flex items-center gap-2 font-medium text-slate-700">
                      <${Icon} name=${h.icon} size=${14} className="text-slate-400" />
                      ${h.name}
                      <span class="text-[11px] tabular-nums font-normal text-slate-400">
                        ${MONTHS[h.date.getUTCMonth()]} ${h.date.getUTCDate()}
                      </span>
                    </span>
                  </td>
                  <td class="py-3">
                    <span class="inline-flex items-center gap-1.5 rounded-full px-2 py-0.5 text-[11.5px] font-medium"
                      style=${{ background: t.soft, color: t.ink }}>
                      <${Icon} name=${t.icon} size=${11} /> ${t.label}
                    </span>
                  </td>
                  <td class="py-3 text-slate-600">${when(s.bestOffset)}</td>
                  <td class="py-3 text-right tabular-nums font-semibold"
                    style=${{ color: s.lands ? t.ink : "#94A3B8" }}>${s.bestMedian}</td>
                  <td class="py-3 text-right tabular-nums text-slate-500">
                    ${Math.round(s.consistency * 100)}% of ${s.years}
                  </td>
                  <td class="px-5 py-3 text-[12.5px] leading-snug">
                    ${s.lands
                      ? html`<span class="font-semibold text-emerald-700">Lands.</span>
                          <span class="text-slate-500"> Shift budget into that week.</span>`
                      : html`<span class="font-semibold text-slate-500">No lift.</span>
                          <span class="text-slate-400">

}

/* ------------------------------ scoreboard ------------------------------- */
function Scoreboard({ cats }) {
  const counts = { CONFIRMED: 0, MISTIMED: 0, OVERRATED: 0, BUSTED: 0 };
  for (const c of cats) for (const as of assumedFor(c.id)) counts[verdictFor(c.id, as).v]++;
  const meta = {
    CONFIRMED: ["#059669", "#ECFDF5", "circle-check", "held up"],
    MISTIMED:  ["#D97706", "#FFFBEB", "circle-alert", "real, wrong month"],
    OVERRATED: ["#EA580C", "#FFF7ED", "minus", "a bump, not a peak"],
    BUSTED:    ["#E11D48", "#FFF1F2", "circle-x", "no peak in the data"],
  };
  return html`
    <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
      ${Object.keys(counts).map(k => {
        const [ink, bg, icon, blurb] = meta[k];
        return html`
          <div key=${k} class=${CARD + " " + CARD_HOVER + " p-4"}>
            <div class="flex items-center gap-2">
              <span class="grid h-7 w-7 place-items-center rounded-lg" style=${{ background: bg, color: ink }}>
                <${Icon} name=${icon} size=${15} />
              </span>
              <span class="text-[32px] font-semibold leading-none tracking-[-0.02em]" style=${{ color: ink }}>${counts[k]}</span>
            </div>
            <div class="mt-2.5 text-[12px] font-semibold uppercase tracking-[0.07em] text-slate-600">${k}</div>
            <div class="text-[12px] text-slate-400">${blurb}</div>
          </div>`;
      })}
    </div>`;
}

/* ------------------------------ mini charts ------------------------------ */
function MonthlyBars({ row, setTip }) {
  const t = theme(row.cat.id), months = row.a.monthly?.months || {};
  const vals = Object.values(months).map(m => m.index);
  if (!vals.length) return null;
  const max = Math.max(125, ...vals), min = Math.min(80, ...vals);
  const h = 132, base = v => ((v - min) / (max - min)) * (h - 26);
  return html`
    <div class="flex h-[132px] items-end gap-[3px]">
      ${MONTHS.map((mn, i) => {
        const info = months[i + 1];
        if (!info) return html`<div key=${mn} class="flex-1" />`;
        const strong = ["REAL PEAK", "MILD BUMP"].includes(info.label);
        return html`
          <div key=${mn} class="group flex flex-1 flex-col items-center justify-end gap-1"
            onMouseMove=${e => setTip({ x: e.clientX, y: e.clientY,
              html: `<b>${mn}</b> · index ${info.index}<br/>${info.label} · ${Math.round(info.consistency * 100)}% of years` })}
            onMouseLeave=${() => setTip(null)}>
            <div class="w-full max-w-[22px] rounded-t-[4px] transition-all duration-200 group-hover:opacity-80"
              style=${{ height: Math.max(base(info.index), 3) + "px",
                        background: strong ? t.mid : t.edge }} />
            <span class="text-[9.5px] font-medium text-slate-400">${mn[0]}</span>
          </div>`;
      })}
    </div>`;
}

function Sparkline({ row }) {
  const t = theme(row.cat.id);
  const src = row.a.monthly || row.a.weekly;
  if (!src) return null;
  const v = src.vals, n = v.length, max = Math.max(...v), min = Math.min(...v);
  const W = 260, H = 40;
  const pts = v.map((y, i) => [i / (n - 1) * W, H - ((y - min) / (max - min || 1)) * (H - 6) - 3]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return html`
    <svg viewBox=${`0 0 ${W} ${H}`} class="h-10 w-full" preserveAspectRatio="none" aria-hidden="true">
      <path d=${d + ` L ${W} ${H} L 0 ${H} Z`} fill=${t.soft} opacity="0.7" />
      <path d=${d} fill="none" stroke=${t.mid} stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
    </svg>`;
}

/* --------------------------------- import -------------------------------- */
function parseTrendsCSVText(text) {
  const lines = text.split(/\r?\n/);
  const hi = lines.findIndex(l => /^"?(Week|Day|Month|Time)"?,/.test(l));
  if (hi < 0) throw new Error("Not a Google Trends export — no Week/Day/Month/Time header found.");
  const unq = s => s.trim().replace(/^"|"$/g, "").trim();
  const kind = unq(lines[hi].split(",")[0]);
  if (kind === "Day") throw new Error("Daily export detected. Use Past 5 years (weekly) or a 10+ year range (monthly).");
  const termNames = lines[hi].split(",").slice(1).map(c => unq(c).split(":")[0].trim()).filter(Boolean);
  const dates = [], cols = termNames.map(() => []);
  for (const line of lines.slice(hi + 1)) {
    if (!line.trim()) continue;
    const cells = line.split(",");
    dates.push(unq(cells[0]));
    cells.slice(1).forEach((c, i) => {
      if (i < cols.length) { const v = unq(c); cols[i].push(v === "<1" ? 0.5 : parseFloat(v) || 0); }
    });
  }
  let granularity = kind === "Month" ? "monthly" : kind === "Week" ? "weekly" : null;
  if (!granularity) {           // "Time" header: infer from row spacing
    const d0 = new Date(dates[0]), d1 = new Date(dates[1]);
    granularity = (d1 - d0) / 864e5 <= 10 ? "weekly" : "monthly";
  }
  return { granularity, terms: termNames.map((n, i) => ({ name: n, dates, values: cols[i] })) };
}

                setPending({ p, name: f.name });
                setMsg({ ok: true, text: `Detected ${p.granularity} data · ${p.terms[0].dates.length} rows `
                  + `(${p.terms[0].dates[0]} → ${p.terms[0].dates.at(-1)}) · terms: `
                  + p.terms.map(t => t.name).join(", ") });
              } catch (err) { setPending(null); setMsg({ ok: false, text: err.message }); }
            }} />
        </div>
        ${msg && html`
          <div class=${"mt-4 rounded-xl p-3 text-[12.5px] leading-relaxed "
            + (msg.ok ? "bg-emerald-50 text-emerald-800" : "bg-rose-50 text-rose-800")}>${msg.text}</div>`}
        <div class="mt-5 flex justify-end gap-2">
          <button onClick=${() => { localStorage.removeItem(LS_IMPORT); onDone(); }}
            class="rounded-full px-3.5 py-2 text-[13px] font-medium text-slate-500 hover:text-slate-800">
            Reset imports
          </button>
          <button onClick=${onClose}
            class="rounded-full border border-[#E2E8F0] px-4 py-2 text-[13px] font-medium text-slate-600 hover:border-slate-300">
            Cancel
          </button>
          <button disabled=${!pending}
            onClick=${() => {
              const overlay = store(LS_IMPORT);
              overlay[catId] ??= {};
              for (const t of pending.p.terms) {
                overlay[catId][t.name] ??= {};
                overlay[catId][t.name][pending.p.granularity] = {
                  source: `${pending.name} (imported ${new Date().toISOString().slice(0, 10)})`,
                  dates: t.dates, values: t.values };
              }
              save(LS_IMPORT, overlay); onDone();
            }}
            class="rounded-full bg-slate-800 px-4 py-2 text-[13px] font-medium text-white shadow-sm transition-all hover:bg-slate-900 disabled:opacity-40">
            Import
          </button>
        </div>
      </div>
    </div>`;
}

/* ----------------------------------- app --------------------------------- */
function App() {
  const [view, setView] = useState("calendar");
  const [nonce, setNonce] = useState(0);
  const [importOpen, setImportOpen] = useState(false);
  const [tip, setTip] = useState(null);
  const [openCell, setOpenCell] = useState(null);
  const cats = useMemo(() => { refreshData(); return CATS; }, [nonce]);
  const [active, setActive] = useState(cats.map(c => c.id));

  const toggle = id => setActive(prev =>
    id === "__all" ? cats.map(c => c.id)
      : prev.includes(id) ? (prev.length === 1 ? prev : prev.filter(x => x !== id))
      : [...prev, id]);

  const rows = useMemo(() => cats.filter(c => active.includes(c.id)).map(c => {
    const term = defaultTerm(c);
    return { cat: c, term, a: getAnalysis(c.id, term) };
  }), [cats, active, nonce]);

  const callouts = useMemo(() => buildCallouts(rows), [rows]);
  const sample = rows.some(r => [r.a.monthly?.source, r.a.weekly?.source]
    .filter(Boolean).some(s => s.startsWith("SAMPLE")));

  return html`
    <div class="min-h-screen bg-[#F8FAFC] text-slate-700 antialiased">
      <${Header} view=${view} setView=${setView} onImport=${() => setImportOpen(true)} />
      <main class="mx-auto max-w-6xl px-6 pb-24">
        ${view === "calendar" ? html`
          <${Hero} cats=${cats} active=${active} toggle=${toggle} />
          ${sample && html`
            <div class="mb-8 flex gap-3 rounded-2xl border border-amber-200 bg-amber-50 p-4 text-[13px] leading-relaxed text-amber-900">
              <${Icon} name="triangle-alert" size=${17} className="mt-px text-amber-500" />
              <span><b>Sample data.</b> One or more categories are showing synthetic series —
                import real Google Trends exports before drawing conclusions.</span>
            </div>`}

          <${Section} eyebrow="Seasonality" title="Twelve months, four life events"
            sub=${html`Each row is one category's headline search term, indexed against its own
                 yearly average — so 100 is normal for that term and rows can be read side by
                 side. <b class="text-slate-600">Click any month</b> to open its weeks, days and
                 holidays.`}>
            <${Heatmap} rows=${rows} setTip=${setTip}
              openCell=${openCell} setOpenCell=${setOpenCell} />
            ${openCell && html`
              <${MonthDetail} key=${openCell.catId + openCell.monthNo}
                catId=${openCell.catId} monthNo=${openCell.monthNo}
                onClose=${() => setOpenCell(null)} setTip=${setTip} />`}
          <//>

          <${Section} eyebrow="Findings" title="What the data actually says"
            sub="Generated from the analysis, not written by hand — which is why some of these
                 cards report a peak that isn't there.">
            <${CalloutCards} callouts=${callouts} />
          <//>

          <${Section} eyebrow="Holidays" title="Does the holiday actually move demand?"
            sub=${html`For every category with readable weekly data, the strongest week in the
                 month around each holiday — measured as a median across years, so one unusual
                 year can't invent an effect. Claimed tie-ins are listed
                 <b class="text-slate-600">even when they fail</b>, because those are the ones
                 plans get built on.`}>
            <${HolidayPanel} rows=${rows} />
          <//>

          <${Section} eyebrow="Reality check" title="Assumed peaks, scored"
            sub="Every peak the plan assumes, judged against the long-horizon data.">
            <${Scoreboard} cats=${cats.filter(c => active.includes(c.id))} />
          <//>

          <${Section} eyebrow="Detail" title="Category by category">
            <div class="grid gap-4 lg:grid-cols-2">
              ${rows.map(r => html`<${CategoryCard} key=${r.cat.id} row=${r} setTip=${setTip} />`)}
            </div>
          <//>

          <footer class="border-t border-[#E2E8F0] pt-6 text-[11.5px] leading-relaxed text-slate-400">
            <b class="text-slate-500">Method.</b> Seasonal index = the median across complete years of
            each month's within-year index (100 = that term's own yearly average). A month is a real
            peak at index ≥ 115 when the bump repeats in ≥ 60% of years; 107–115 is a mild bump. Ramp
            timing needs the average year to rise ≥ 10% above its own median, and the weekly and
            monthly tests must agree. One-off spikes are detected by modified z-score against each
            calendar period's median and excluded. Google Trends is a <b class="text-slate-500">relative
            index (0–100)</b> within each query — never search volume, and terms from separate exports
            are not comparable.
          </footer>`
        : html`<${BudgetView} cats=${cats} setTip=${setTip} />`}
      </main>
      <${Tooltip} tip=${tip} />
      <${ImportDialog} cats=${cats} open=${importOpen} onClose=${() => setImportOpen(false)}
        onDone=${() => { setImportOpen(false); setNonce(n => n + 1); }} />
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);

</script>
</body>
</html>
